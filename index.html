<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="暑期学习管理 - 多学科家庭学习系统（英语/数学/语文），二级树形导航，词汇卡片 + 发音 + 进度追踪">
  <title>暑期学习管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- ==================== 顶部导航 ==================== -->
    <header class="app-header">
      <div class="header-left">
        <span class="header-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <div class="header-title">
          <h1>暑期学习管理</h1>
          <div class="subtitle">英语 · 小学词汇复习</div>
        </div>
      </div>
      <div class="header-right">
        <span class="header-date" id="headerDate">📅 加载中...</span>
        <div class="header-buttons">
          <button class="btn btn-header-action" id="headerSrsBtn">🧠 今日复习</button>
          <button class="btn btn-header-action" id="headerDownloadBtn">📚 资料下载</button>
        </div>
      </div>
    </header>

    <!-- ==================== 主内容区（三栏布局） ==================== -->
    <main class="app-main">

      <!-- ===== 左侧：分类导航 ===== -->
      <aside class="sidebar-card sidebar-categories" role="navigation" aria-label="词汇分类导航">
        <div class="sidebar-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          分类
        </div>
        <div class="sidebar-body">
          <ul class="tree-list" id="sidebarNav">
            <!-- 由 JavaScript 动态渲染树形菜单 -->
          </ul>
        </div>
      </aside>

      <!-- ===== 中间：单词学习区 ===== -->
      <section class="word-area" role="main" aria-label="单词学习区域">
        <div class="word-area-header">
          <div>
            <h2 class="word-area-title" id="categoryTitle">
              <span class="cat-icon">📖</span> 选择分类
              <span class="word-count-badge" id="wordCount">0 个单词</span>
            </h2>
            <div class="word-area-desc" id="categoryDesc">点击左侧分类开始学习</div>
          </div>
        </div>
        <div class="word-grid" id="wordGrid">
          <!-- 由 JavaScript 动态渲染 -->
        </div>
      </section>

    </main>

      <!-- ==================== 默写挑战弹窗 ==================== -->
      <div class="challenge-overlay" id="challengeOverlay" style="display:none;">
        <div class="challenge-container">
          <!-- 顶部：标题 + 信息 + 关闭 -->
          <div class="challenge-header">
            <div class="challenge-title">✏️ 单词拼写闯关</div>
            <div class="challenge-meta">
              <span class="challenge-category" id="challengeCategory"></span>
              <span class="challenge-count" id="challengeWordCount"></span>
            </div>
            <button class="challenge-close" id="challengeClose" title="关闭">✕</button>
          </div>

          <!-- 中部：游戏内容 -->
          <div class="challenge-body">

            <!-- 进度 -->
            <div class="challenge-progress">
              第 <span id="challengeCurrentNum">0</span>
              / <span id="challengeTotalNum">0</span> 题
            </div>

            <!-- 游戏主区域 -->
            <div id="challengeGameContent">
              <!-- 中文提示 + 发音按钮（由 JS 动态渲染） -->
              <div id="hintRowContainer"></div>

              <!-- 拼写格 -->
              <div class="spelling-slots" id="spellingSlots"></div>

              <!-- 字母选择区 -->
              <div class="letter-grid" id="letterGrid"></div>

              <!-- 提交按钮 -->
              <div class="challenge-submit-area">
                <button class="btn btn-challenge-submit" id="challengeSubmit">提交答案</button>
              </div>

              <!-- 反馈区 -->
              <div class="challenge-feedback" id="challengeFeedback" style="display:none;"></div>
            </div>

            <!-- 完成页 -->
            <div class="challenge-complete" id="challengeComplete" style="display:none;">
              <div class="complete-icon">🏆</div>
              <div class="complete-title">挑战完成！</div>

              <!-- 星级评价 -->
              <div class="complete-stars-row">
                <span class="complete-stars" id="completeStars">★★★★★</span>
              </div>
              <div class="complete-star-comment" id="completeStarComment">🌟 太棒了！</div>

              <!-- 统计面板 -->
              <div class="complete-stats">
                <div class="stat-row">完成题数：<span id="completeTotal">0</span></div>
                <div class="stat-row">正确数量：<span id="completeCorrect">0</span></div>
                <div class="stat-row">得　　分：<span id="completeScore">0</span> 分</div>
                <div class="stat-row">🔥 最高连续正确：<span id="completeMaxCombo">0</span> 题</div>
              </div>

              <!-- 操作按钮 -->
              <div class="complete-actions">
                <button class="btn btn-challenge-submit" id="completeContinueBtn">📖 继续学习</button>
                <button class="btn btn-complete-retry" id="completeRetryBtn">🔁 重新挑战错词</button>
              </div>
            </div>

          </div>
        </div>
      </div>
      <!-- ==================== /默写挑战弹窗 ==================== -->

      <!-- ==================== 资料下载弹窗 ==================== -->
      <div class="download-overlay" id="downloadOverlay" style="display:none;">
        <div class="download-modal">
          <div class="download-modal-header">
            <span class="download-modal-title">📚 学习资料下载</span>
            <button class="download-modal-close" id="downloadClose" title="关闭">✕</button>
          </div>
          <div class="download-list" id="downloadList">
            <div class="download-loading">⏳ 加载中...</div>
          </div>
        </div>
      </div>
      <!-- ==================== /资料下载弹窗 ==================== -->

      <!-- ==================== 单词详情弹窗 ==================== -->
      <div class="word-detail-overlay" id="wordDetailOverlay" style="display:none;">
        <div class="word-detail-modal">
          <div class="word-detail-header">
            <div class="word-detail-header-left">
              <span class="word-detail-icon">📖</span>
              <span class="word-detail-title">单词详情</span>
            </div>
            <button class="word-detail-close" id="wordDetailClose" title="关闭">✕</button>
          </div>
          <div class="word-detail-body" id="wordDetailBody">
            <!-- 由 JavaScript 动态渲染 -->
          </div>
        </div>
      </div>
      <!-- ==================== /单词详情弹窗 ==================== -->

  </div>

  <!-- ==================== JavaScript ==================== -->
  <script src="js/tracker.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/vocab-data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
